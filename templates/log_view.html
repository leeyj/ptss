<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Log Viewer - {{ path }}</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/log_viewer.css') }}">
</head>
<body>
    <header>
        <div class="path-text">📁 {{ path }} ({{ host.name }})</div>
        <div id="status">
            {% if log_view_mode == 'tail' %}
            <span class="badge">LIVE TAIL</span>
            {% endif %}
        </div>
    </header>
    <div class="log-container" id="logContent">로딩 중...</div>

    <script src="{{ url_for('static', filename='js/log_viewer.js') }}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            LogViewer.init({
                hostId: '{{ host.id }}',
                path: '{{ path }}',
                logViewMode: '{{ log_view_mode }}'
            });
        });
    </script>
</body>
</html>
