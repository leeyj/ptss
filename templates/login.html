{% extends "layout.html" %}
{% block extra_head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">🔐</div>
            <h1 class="auth-title">PTSS Login</h1>
            <p style="color: var(--text-muted); margin-top: 10px;">프리미엄 시스템 관리를 위한 인증</p>
        </div>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div style="background: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger); color: var(--danger); padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem; text-align: center;">
              {% for message in messages %}
                {{ message }}
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" required placeholder="admin" class="auth-input">
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" required placeholder="••••••••" class="auth-input">
            </div>
            <button type="submit" class="btn-auth">
                로그인
            </button>
        </form>
    </div>
</div>
{% endblock %}
