{% extends "layout.html" %}

{% block extra_head %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/console.css') }}">
    <script src="{{ url_for('static', filename='js/console_settings.js') }}"></script>
{% endblock %}

{% block content %}
<div class="card glass">
    <h2 style="color: var(--accent-color); margin-bottom: 24px;">⚙️ 환경 설정</h2>
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 40px;">
        <!-- 시스템 설정 (Server Side) -->
        <div>
            <h3 style="font-size: 1.1rem; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">🖥️ 시스템 설정</h3>
            <form method="POST">
                <div style="margin-bottom: 30px;">
                    <label style="display: block; margin-bottom: 12px; font-weight: 600;">로그 보기 모드</label>
                    <div style="display: flex; flex-direction: column; gap: 10px;">
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="radio" name="log_view_mode" value="preview" {% if log_view_mode == 'preview' %}checked{% endif %} style="width: auto; margin: 0;">
                            <span>📄 미리 보기 (정적)</span>
                        </label>
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="radio" name="log_view_mode" value="tail" {% if log_view_mode == 'tail' %}checked{% endif %} style="width: auto; margin: 0;">
                            <span>🔄 실시간 Tail (동적)</span>
                        </label>
                    </div>
                </div>

                <div style="margin-bottom: 30px;">
                    <label style="display: block; margin-bottom: 12px; font-weight: 600;">SFTP 기본 정렬 기준</label>
                    <div style="display: flex; flex-direction: column; gap: 10px;">
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="radio" name="sftp_sort_by" value="name" {% if sftp_sort_by == 'name' %}checked{% endif %} style="width: auto; margin: 0;">
                            <span>🔡 이름순</span>
                        </label>
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="radio" name="sftp_sort_by" value="type" {% if sftp_sort_by == 'type' %}checked{% endif %} style="width: auto; margin: 0;">
                            <span>📁 유형순</span>
                        </label>
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="radio" name="sftp_sort_by" value="date" {% if sftp_sort_by == 'date' %}checked{% endif %} style="width: auto; margin: 0;">
                            <span>📅 날짜순</span>
                        </label>
                    </div>
                </div>

                <div style="margin-bottom: 30px;">
                    <label style="display: block; margin-bottom: 12px; font-weight: 600;">SSH 세션 유지 (Keepalive)</label>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <input type="number" name="ssh_keepalive_interval" value="{{ ssh_keepalive_interval }}" min="0" max="300" style="width: 100px; padding: 10px; background: #0f172a; border: 1px solid var(--border-color); border-radius: 8px; color: white;">
                        <span style="color: var(--text-muted); font-size: 0.9rem;">초 (0: 비활성, 권장: 30~60초)</span>
                    </div>
                </div>

                <div style="margin-bottom: 30px;">
                    <label style="display: block; margin-bottom: 12px; font-weight: 600;">터미널 세션 유지 정책</label>
                    <div style="display: flex; flex-direction: column; gap: 10px;">
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="radio" name="session_retention" value="maintain" {% if session_retention == 'maintain' %}checked{% endif %} style="width: auto; margin: 0;">
                            <span>🏢 기업형 (창을 닫아도 연결 유지)</span>
                        </label>
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="radio" name="session_retention" value="terminate" {% if session_retention == 'terminate' %}checked{% endif %} style="width: auto; margin: 0;">
                            <span>🏛️ 공공기관형 (창을 닫으면 즉시 종료)</span>
                        </label>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">시스템 설정 저장</button>
            </form>
        </div>

        <!-- 터미널 설정 (Client Side / LocalStorage) -->
        <div class="terminal-settings-section">
            <h3 style="font-size: 1.1rem; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">📺 터미널 테마 및 폰트</h3>
            
            <div class="setting-group" style="margin-bottom: 24px;">
                <label style="display: block; margin-bottom: 12px; font-weight: 600;">터미널 테마 (Theme)</label>
                <div class="theme-grid">
                    <div class="theme-item" onclick="PTSS.Settings.setTheme('default')" data-theme="default">
                        <div class="theme-preview" style="background: #0f172a;"></div>
                        <span>Default</span>
                    </div>
                    <div class="theme-item" onclick="PTSS.Settings.setTheme('monokai')" data-theme="monokai">
                        <div class="theme-preview" style="background: #272822;"></div>
                        <span>Monokai</span>
                    </div>
                    <div class="theme-item" onclick="PTSS.Settings.setTheme('dracula')" data-theme="dracula">
                        <div class="theme-preview" style="background: #282a36;"></div>
                        <span>Dracula</span>
                    </div>
                    <div class="theme-item" onclick="PTSS.Settings.setTheme('solarized')" data-theme="solarized">
                        <div class="theme-preview" style="background: #002b36;"></div>
                        <span>Solarized</span>
                    </div>
                    <div class="theme-item" onclick="PTSS.Settings.setTheme('onedark')" data-theme="onedark">
                        <div class="theme-preview" style="background: #282c34;"></div>
                        <span>One Dark</span>
                    </div>
                </div>
            </div>
            
            <div style="display: flex; gap: 20px; margin-bottom: 24px;">
                <div style="flex: 1;">
                    <label style="display: block; margin-bottom: 12px; font-weight: 600;">폰트 크기</label>
                    <input type="number" id="settingFontSize" value="14" min="10" max="24" onchange="PTSS.Settings.setFontSize(this.value)">
                </div>
                <div style="flex: 2;">
                    <label style="display: block; margin-bottom: 12px; font-weight: 600;">폰트 종류</label>
                    <select id="settingFontFamily" onchange="PTSS.Settings.setFontFamily(this.value)">
                        <option value='"JetBrains Mono", monospace'>JetBrains Mono</option>
                        <option value='"Fira Code", monospace'>Fira Code</option>
                        <option value='"Roboto Mono", monospace'>Roboto Mono</option>
                        <option value='"Source Code Pro", monospace'>Source Code Pro</option>
                        <option value='Consolas, "Courier New", monospace'>Consolas / Courier</option>
                    </select>
                </div>
            </div>
            
            <div style="margin-bottom: 24px;">
                <label style="display: flex; align-items: center; gap: 12px; cursor: pointer; background: rgba(56, 189, 248, 0.05); padding: 15px; border-radius: 12px; border: 1px solid rgba(56, 189, 248, 0.1);">
                    <div style="flex: 1;">
                        <span style="display: block; font-weight: 600; color: var(--accent-color); margin-bottom: 4px;">🚀 GPU 가속 (WebGL)</span>
                        <span style="display: block; font-size: 0.8rem; color: var(--text-muted);">대용량 출력 시 렌더링 성능을 획기적으로 향상시킵니다. (일부 환경에서 미지원 가능)</span>
                    </div>
                    <input type="checkbox" id="settingWebgl" onchange="PTSS.Settings.setWebgl(this.checked)" style="width: 24px; height: 24px; cursor: pointer;">
                </label>
            </div>
            
            <p style="color: var(--text-muted); font-size: 0.85rem; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; line-height: 1.5;">
                💡 터미널 설정은 브라우저에 즉시 저장되며, 모든 터미널 세션에 실시간으로 적용됩니다.
            </p>
        </div>
    </div>
</div>
{% endblock %}
