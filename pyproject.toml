[tool.ruff]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = ["E", "F"]
ignore = ["E501"] # Ignore line length violations

# Avoid enforcing line-length violations
line-length = 88

[tool.ruff.per-file-ignores]
# Ignore `F401` (imported but unused) in `__init__.py` files.
"__init__.py" = ["F401"]
"ptss.py" = ["E402"] # Module level import not at top of file

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
